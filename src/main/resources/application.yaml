server:
  port: 8081
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  flyway:
    enabled: ${CAMPUSDEAL_FLYWAY_ENABLED:false}
    baseline-on-migrate: ${CAMPUSDEAL_FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: ${CAMPUSDEAL_FLYWAY_BASELINE_VERSION:1}
    locations: classpath:db/migration
  liquibase:
    enabled: false
  application:
    name: campus-deal
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${CAMPUSDEAL_DB_URL:jdbc:mysql://localhost:3306/campusdeal?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${CAMPUSDEAL_DB_USERNAME:root}
    password: ${CAMPUSDEAL_DB_PASSWORD:}
    hikari:
      # T16：秒杀同步落库 30 并发时，默认池(10)会让后半请求排队等 DB 连接，拉高 S1 尾延迟。
      # 扩到 30 后 30 并发 INSERT 全部并行（单条 INSERT ~2-5ms）。
      maximum-pool-size: 30
  data:
    redis:
        host: ${CAMPUSDEAL_REDIS_HOST:localhost}
        port: ${CAMPUSDEAL_REDIS_PORT:6379}
        password: ${CAMPUSDEAL_REDIS_PASSWORD:}
        lettuce:
          pool:
            # T16：本环境（Windows 本机 Redis 3.2）实测共享连接并发延迟优于显式连接池，
            # RedisConfig 已固定 shareNativeConnection=true，此处池参数仅作生产（多核 Linux Redis）
            # 高并发调优参考，本地默认不生效。
            max-active: 50
            max-idle: 20
            min-idle: 1
#            time-between-eviction-runs: 10s
  kafka:
    bootstrap-servers: ${CAMPUSDEAL_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      # 异步落库：acks=all 保证消息被 ISR 确认后才视为投递成功（Kafka 成为订单持久化点）
      acks: all
      properties:
        # Kafka 不可用时元数据获取最多阻塞 3s（默认 60s），避免秒杀接口长时间卡死
        max.block.ms: 3000
        retries: 3
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      # 批量消费：让 broker 至少累计 50KB（约 500 条）或等待 1s 才返回一次 fetch，
      # 避免 fetch.min.bytes=1 默认值「来一条就返回一条」的碎片化小批次。
      # 实测默认值把 10000 单拆成 7418 个小批次（Redis pipeline/DB 往返各 7418 次），
      # 聚合后批次数下降 1~2 个数量级，既提升吞吐、也大幅降低 Redis 连接 churn。
      max-poll-records: 500
      fetch-min-size: 51200
      fetch-max-wait: 1000ms
      properties:
        spring.json.trusted.packages: com.campusdeal.mq
    listener:
      ack-mode: manual
      auto-startup: ${CAMPUSDEAL_KAFKA_ENABLED:false}
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: com.campusdeal.entity # 别名扫描包

  ddl-runner:
    enabled: false

# ===== Phase 2: 多级缓存与布隆过滤器 =====
campusdeal:
  upload:
    root: ${CAMPUSDEAL_UPLOAD_ROOT:./data/uploads}
    max-size-bytes: ${CAMPUSDEAL_UPLOAD_MAX_SIZE_BYTES:5242880}
    allowed-content-types: ${CAMPUSDEAL_UPLOAD_ALLOWED_CONTENT_TYPES:image/jpeg,image/png,image/gif,image/webp}
  health:
    max-outbox-age-minutes: ${CAMPUSDEAL_HEALTH_MAX_OUTBOX_AGE_MINUTES:15}
    max-pending-intents: ${CAMPUSDEAL_HEALTH_MAX_PENDING_INTENTS:100}
    max-bloom-rebuild-age-minutes: ${CAMPUSDEAL_HEALTH_MAX_BLOOM_REBUILD_AGE_MINUTES:15}
  cache:
    stock-ttl-seconds: 1        # 秒杀库存标记缓存 TTL
    stock-max-size: 10000
    merchant-ttl-seconds: 30    # 商户热点数据缓存 TTL
    merchant-max-size: 1000
  bloom:
    expected-insertions: 10000  # 预期插入元素数
    fpp: 0.01                   # 误判率 1%
    rebuild-interval-seconds: 300  # 定时重建周期（秒）
  kafka:
    enabled: ${CAMPUSDEAL_KAFKA_ENABLED:false}
    topic:
      flash-deal-orders: flash-deal-orders   # 秒杀订单 Topic
  flashdeal:
    durable-acceptance-enabled: ${CAMPUSDEAL_FLASH_DURABLE_ACCEPTANCE_ENABLED:true}
    durable-acceptance-cutover-enabled: ${CAMPUSDEAL_FLASH_DURABLE_ACCEPTANCE_CUTOVER_ENABLED:true}
    durable-acceptance-shadow-enabled: ${CAMPUSDEAL_FLASH_DURABLE_ACCEPTANCE_SHADOW_ENABLED:false}
    legacy-outbox-repair-enabled: ${CAMPUSDEAL_FLASH_LEGACY_OUTBOX_REPAIR_ENABLED:false}
    recovery-enabled: ${CAMPUSDEAL_FLASH_RECOVERY_ENABLED:true}
    reservation-recovery-interval-ms: ${CAMPUSDEAL_FLASH_RESERVATION_RECOVERY_INTERVAL_MS:30000}
    redis-recovery-interval-ms: ${CAMPUSDEAL_FLASH_REDIS_RECOVERY_INTERVAL_MS:60000}
  canal:
    enabled: ${CAMPUSDEAL_CANAL_ENABLED:false}
    host: ${CAMPUSDEAL_CANAL_HOST:localhost}
    port: ${CAMPUSDEAL_CANAL_PORT:11111}
    destination: ${CAMPUSDEAL_CANAL_DESTINATION:example}
  # ===== Phase 3 (Module 04): AI Agent =====
  # DeepSeek API Key：环境变量注入；本地开发 key 见 application-local.yaml（已 gitignore）
  deepseek:
    api-key: ${CAMPUSDEAL_DEEPSEEK_API_KEY:}
    base-url: ${CAMPUSDEAL_DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
    # ===== Phase 3 (Module 05): RAG 检索 =====
    embedding-model: ${CAMPUSDEAL_DEEPSEEK_EMBEDDING_MODEL:deepseek-embedding}  # DeepSeek Embedding 模型（1024 维）
    embedding-dimension: ${CAMPUSDEAL_DEEPSEEK_EMBEDDING_DIMENSION:1024}
  agent:
    enabled: ${CAMPUSDEAL_AGENT_ENABLED:true}
    max-iterations: 5   # ReAct 循环最大迭代次数（think 节点）
  # ===== Phase 3 (Module 06): 安全与上下文管理 =====
  security:
    confirm-tools: [applyRefund]   # 需要用户二次确认的工具
    denied-tools: []               # 直接拒绝的工具
    pii-mode: MASK                 # PII 脱敏模式：MASK / REMOVE / PASS
    injection-sensitivity: 0.8     # Prompt Injection 检测灵敏度
    hallucination-check: true      # 输出幻觉检测开关
    append-safety-note: false      # 是否在回复末尾附加安全提示
    rate-limit-per-minute: 10      # 每用户每分钟最大请求数
    verification-send-per-minute: ${CAMPUSDEAL_VERIFICATION_SEND_PER_MINUTE:3}
    verification-attempt-per-minute: ${CAMPUSDEAL_VERIFICATION_ATTEMPT_PER_MINUTE:10}
  # ===== Phase 3 (Module 05): 向量存储 PGVector =====
  # 留空时向量检索禁用（应用照常启动，BM25 关键词检索仍可用）
  pgvector:
    enabled: ${CAMPUSDEAL_PGVECTOR_ENABLED:false}
    dimension: ${CAMPUSDEAL_PGVECTOR_DIMENSION:${CAMPUSDEAL_DEEPSEEK_EMBEDDING_DIMENSION:1024}}
    schema-location: ${CAMPUSDEAL_PGVECTOR_SCHEMA_LOCATION:classpath:db/pgvector/V1__pgvector_schema.sql}
    url: ${CAMPUSDEAL_PGVECTOR_URL:}
    username: ${CAMPUSDEAL_PGVECTOR_USERNAME:}
    password: ${CAMPUSDEAL_PGVECTOR_PASSWORD:}
  rag:
    reindex: ${CAMPUSDEAL_RAG_REINDEX:false}
    reindex-checkpoint: ${CAMPUSDEAL_RAG_REINDEX_CHECKPOINT:./data/rag-reindex.checkpoint}
  # ===== Phase 3 (Module 05): Neo4j 知识图谱 =====
  # Driver 懒加载，实例未启动时应用照常启动，图谱查询降级为空结果
  neo4j:
    enabled: ${CAMPUSDEAL_NEO4J_ENABLED:false}
    uri: ${CAMPUSDEAL_NEO4J_URI:bolt://localhost:7687}
    user: ${CAMPUSDEAL_NEO4J_USER:}
    password: ${CAMPUSDEAL_NEO4J_PASSWORD:}



logging:
  level:
    com.campusdeal: info
